name: mfc_youth_flutter
description: "MFC Youth Area Management System - Flutter Mobile & Desktop Client"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo-2.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo-2.png"
  windows:
    generate: true
    image_path: "assets/images/logo-2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
